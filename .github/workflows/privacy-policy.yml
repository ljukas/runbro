# Publishes docs/privacy-policy.md as the public page the store listings link to.
# why only that file: Jekyll over all of docs/ would publish the ADRs too, and Liquid
# chokes on the `{{…}}` they quote.
name: Privacy policy

on:
  push:
    branches: [main]
    paths: [docs/privacy-policy.md, .github/workflows/privacy-policy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy-policy/
    steps:
      - uses: actions/checkout@v5
      - name: Stage the page
        run: |
          mkdir -p site
          printf -- '---\ntitle: RunBro Privacy Policy\npermalink: /privacy-policy/\n---\n\n' > site/privacy-policy.md
          cat docs/privacy-policy.md >> site/privacy-policy.md
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
